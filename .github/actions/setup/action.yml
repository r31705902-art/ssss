name: setup
description: python deps + static ffmpeg + model caches
inputs:
  whisper:
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: worker/requirements.txt
    - name: cache ffmpeg
      id: ffc
      uses: actions/cache@v4
      with:
        path: ~/ffmpeg
        key: ffmpeg-btbn-v2
    - name: get ffmpeg
      if: steps.ffc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/ffmpeg && cd ~/ffmpeg
        for i in 1 2 3 4 5; do curl -sSL --retry 5 -o f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break; sleep 10; done
        tar xJf f.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' && rm f.tar.xz
    - shell: bash
      run: |
        echo "$HOME/ffmpeg" >> $GITHUB_PATH
        pip install -q -r worker/requirements.txt || (sleep 20 && pip install -q -r worker/requirements.txt)
        pip install -q -U yt-dlp
    - name: model cache
      if: inputs.whisper != ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/models
        key: models-${{ inputs.whisper }}-v1
